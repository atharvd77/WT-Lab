# Copy this file's values into application.properties (or set as environment
# variables / a Spring profile) and fill in your own local configuration.

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/vit_sgpa_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password

spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=replace_with_a_long_random_secret_at_least_32_characters
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
