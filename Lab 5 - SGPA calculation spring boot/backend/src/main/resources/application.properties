# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/vit_sgpa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
# 'update' will auto-create/alter tables from the entity classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
# IMPORTANT: replace with your own long, random secret (32+ chars) in production.
app.jwt.secret=ReplaceThisWithALongRandomBase64SecretStringForJWTSigning1234567890
app.jwt.expiration-ms=86400000

# ==============================
# CORS (frontend dev server)
# ==============================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
