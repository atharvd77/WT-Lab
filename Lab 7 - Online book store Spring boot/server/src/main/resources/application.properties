server.port=${PORT:5000}
server.servlet.context-path=/api
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookverse}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:bookverse-dev-secret-change-me}
app.jwt.expiration=${JWT_EXPIRES_IN:7d}
app.client-url=${CLIENT_URL:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL:admin@bookverse.com}
app.admin-password=${ADMIN_PASSWORD:Admin@12345}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
